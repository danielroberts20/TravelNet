# Drop-in for travelnet.service. Install:
#   sudo mkdir -p /etc/systemd/system/travelnet.service.d
#   sudo cp /home/dan/services/TravelNet/server/scripts/systemd/sync-travel-yml.conf /etc/systemd/system/travelnet.service.d/
#   sudo systemctl daemon-reload
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
# Leading "-": a sync failure never stops the stack from starting.
ExecStartPre=-/bin/bash /home/dan/services/TravelNet/server/scripts/sync_travel_yml.sh restart
