events {}
http {
    log_format filtered '$remote_addr - [$time_local] "$request" $status';

    server {
        listen 80;

        # Docker healthcheck target: answered by nginx itself, no upstream involved.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.travelnet.dev;
        ssl_certificate     /etc/letsencrypt/live/api.travelnet.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.travelnet.dev/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;
        client_max_body_size 50m;

        location / {
            # Re-resolve the upstream through Docker's DNS every 10 s. A literal host in proxy_pass is
            # resolved once at start-up, so a recreated container (new IP) would be a 502 until reload.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://ingest:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name ae0b9d1a.travelnet.dev;
        ssl_certificate     /certs/constellation.crt;
        ssl_certificate_key /certs/constellation.key;
        client_max_body_size 25m;

        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $constellation_upstream http://constellation:5000;
            proxy_pass $constellation_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            add_header X-Accel-Buffering no;
        }
    }
}