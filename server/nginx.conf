events {}
http {
    log_format filtered '$remote_addr - [$time_local] "$request" $status';

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.travelnet.dev;
        ssl_certificate     /etc/letsencrypt/live/api.travelnet.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.travelnet.dev/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;
        client_max_body_size 50m;

        location / {
            proxy_pass http://ingest:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name ae0b9d1a.travelnet.dev;
        ssl_certificate     /certs/constellation.crt;
        ssl_certificate_key /certs/constellation.key;
        client_max_body_size 25m;

        location / {
            proxy_pass http://constellation:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            add_header X-Accel-Buffering no;
        }
    }
}