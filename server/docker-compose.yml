services:
  ingest:
    build: .
    image: travelnet:latest
    container_name: travelnet
    mem_limit: 1g          # FastAPI + all scheduled task flows
    init: true
    env_file: .env
    environment:
      CRONTAB_FILE: "/var/spool/cron/crontabs/dan"
      PREFECT_API_URL: "http://prefect-server:4200/api"   # same Docker network; no Tailscale dependency
      PREFECT_UI_URL: "http://travelnet.tail186ff8.ts.net:4200"   # browser-facing, used only for run links in logs
    volumes:
      - /mnt/ssd/docker/services/travelnet/data:/data
      - /mnt/linux/docker/services/travelnet/data/backups:/data/backups
      - ./app:/app
      - /home/dan/.config/rclone:/root/.config/rclone:ro
      - /var/spool/cron/crontabs/dan:/var/spool/cron/crontabs/dan
      - /home/dan/services/TravelNet/travel.yml:/travel.yml:rw
      - /mnt/linux/docker/services/travelnet/.travelnet_backup_key:/data/.travelnet_backup_key:ro
      # SSH key + pinned host key for the compute PC (COMPUTE_SSH_KEY_PATH / COMPUTE_KNOWN_HOSTS_PATH).
      # A directory on purpose: a missing single-file mount source would be created as a root-owned dir.
      - /home/dan/.config/travelnet-compute:/run/secrets/compute:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:           # event-loop liveness; 3 misses (~90 s) => "unhealthy", which check_system_health.py restarts
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s    # init_db() on a ~1 GB database
    networks:
      - travelnet

  # The dashboard used to mount /var/run/docker.sock (root on the host). It only needs to follow
  # the logs of two containers and restart three, so it talks to this allow-list proxy instead.
  docker-proxy:
    image: haproxy:3.0-alpine
    container_name: travelnet-docker-proxy
    restart: unless-stopped
    user: root             # needs to read the root-owned Docker socket; everything else is dropped below
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 32m
    pids_limit: 64
    volumes:
      - ./docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:           # the proxy itself answers /_ping when it is up and the socket is reachable
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - travelnet

  dashboard:
    build:
      context: ../../Dashboard
    container_name: travelnet-dashboard
    mem_limit: 384m        # Flask/gunicorn 2 workers, mostly reads
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DASHBOARD_TOKEN:       "${DASHBOARD_TOKEN}"
      FLASK_SECRET_KEY:      "${FLASK_SECRET_KEY}"
      DB_PATH:               "/data/travel.db"
      FASTAPI_URL:           "http://ingest:8000"
      FASTAPI_API_KEY:       "${UPLOAD_TOKEN}"
      DOCKER_CONTAINER_NAME: "travelnet"
      TREVOR_CONTAINER_NAME: "trevor"
      TREVOR_URL:            "${TREVOR_URL}"
      TREVOR_API_KEY:        "${TREVOR_API_KEY}"
      WATCHDOG_IP: "${WATCHDOG_IP}"
      PREFECT_API_URL: "http://prefect-server:4200/api"   # was the app.py default (Tailscale hostname)
      PREFECT_UI_URL:  "http://travelnet.tail186ff8.ts.net:4200"   # browser-facing link; change when Tailscale is retired
      PREFECT_API_AUTH_STRING: "${PREFECT_API_AUTH_STRING:-}"   # Prefect server HTTP Basic credentials ("user:password")
      DOCKER_HOST: "tcp://docker-proxy:2375"   # allow-listed proxy, not the raw socket (see docker-proxy/haproxy.cfg)
    volumes:
      - /mnt/ssd/docker/services/travelnet/data:/data:ro
      - /mnt/linux/docker/services/travelnet/data/backups:/data/backups:ro
      - /home/dan/services/Dashboard:/app
      - /home/dan/services/TravelNet/server:/travelnet-server:ro
      - /home/dan/services/codex:/docs:ro
      - /home/dan/services/TravelNet/travel.yml:/travel.yml:rw
      - /mnt/linux/docker/services/travelnet/.travelnet_backup_key:/data/.travelnet_backup_key:ro
    depends_on:
      ingest:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:           # /healthz is explicit and unauthenticated; the SPA catch-all returns 200 for any path
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - travelnet

  nginx:
    image: nginx:alpine
    container_name: travelnet-nginx
    mem_limit: 64m         # pure proxy, negligible memory
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/dan/services/Dashboard/certs:/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dashboard
    healthcheck:           # answered by nginx itself (see /nginx-health in nginx.conf)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - travelnet
      - constellation      # reaches Constellation here; Constellation is no longer on the travelnet network

  prefect-worker:
    build: .
    image: travelnet:latest
    command: python -m deployments
    mem_limit: 768m        # runs flows, needs headroom for ML-adjacent tasks later
    init: true
    env_file: .env
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PREFECT_UI_URL=http://travelnet.tail186ff8.ts.net:4200
      - PREFECT_RUNNER_SERVER_ENABLE=true   # Prefect's built-in runner health endpoint on 127.0.0.1:8080 (503 if it has not polled for 20 s)
    volumes:
      - /mnt/ssd/docker/services/travelnet/data:/data
      - /mnt/linux/docker/services/travelnet/data/backups:/data/backups
      - ./app:/app
      - /mnt/linux/docker/services/travelnet/data/backup_db_to_cloudflare.sh:/backup_db_to_cloudflare.sh:ro
      - /home/dan/.config/rclone:/root/.config/rclone:ro
      - /mnt/linux/docker/services/travelnet/.travelnet_backup_key:/data/.travelnet_backup_key:ro
      - /var/spool/cron/crontabs/dan:/var/spool/cron/crontabs/dan
    restart: unless-stopped
    depends_on:
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # registering ~35 deployments takes a while, longer if the server is busy
    networks:
      - travelnet

networks:
  travelnet:
    name: travelnet
  # Constellation is the most exposed app (public uploads/media). It only needs to be reachable by
  # nginx, so it lives on its own network instead of sharing travelnet with the API and Prefect.
  constellation:
    name: constellation