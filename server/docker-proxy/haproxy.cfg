# Allow-list proxy in front of the Docker socket, for the dashboard only.
#
# The dashboard used to mount /var/run/docker.sock directly, which is root on the
# host (":ro" does not restrict the API). It needs exactly two things:
#   * follow the logs of the API and Trevor containers   (docker logs --follow)
#   * restart the API, Trevor and the dashboard itself   (docker restart)
# plus the harmless _ping/version calls the docker CLI makes first, and the
# container inspect (/json) that `docker logs` does to learn the container ID and TTY mode.
# Everything else (create, exec, run, images, volumes, ...) is refused with 403.
#
# The container names below mirror the allow-lists in Dashboard/app.py; keep them in sync.

global
    log stdout format raw local0
    maxconn 32

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  1h      # `docker logs --follow` is a long-lived stream
    timeout server  1h
    timeout tunnel  1h

frontend docker_api
    bind :2375

    # Optional API-version prefix such as /v1.47
    acl ping     path_reg ^(/v[0-9.]+)?/(_ping|version)$
    acl logs     path_reg ^(/v[0-9.]+)?/containers/(travelnet|trevor)/(logs|json)$
    acl restart  path_reg ^(/v[0-9.]+)?/containers/(travelnet|trevor|travelnet-dashboard)/restart$
    # `docker logs NAME` first inspects by name (the rule above), then fetches the logs by the
    # container's 64-character ID. Read-only, and an ID can only be learned from the inspect
    # above (which is limited to the two names); listing containers is refused.
    acl logs_id  path_reg ^(/v[0-9.]+)?/containers/[0-9a-f]{64}/logs$

    acl is_read  method GET HEAD
    acl is_post  method POST

    http-request allow if is_read ping
    http-request allow if is_read logs
    http-request allow if is_read logs_id
    http-request allow if is_post restart
    http-request deny deny_status 403

    default_backend docker_socket

backend docker_socket
    server docker unix@/var/run/docker.sock
